<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Les Bonnes Pièces</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="pieces.js"></script>
    <script src="node_modules/chart.js/dist/chart.umd.js" defer></script>
  </head>
  <body>
    <header>
      <img src="images/logo-les-bonnes-pieces.png" alt="LOGO" />
      <h1>Les Bonnes Pièces</h1>
    </header>
    <main>
      <!-- Menu de recherche -->
      <section class="filtres">
        <h3>Filtres</h3>

        <button class="btn-trier-croissant">Trier par prix croissant</button>
        <br />
        <button class="btn-trier-decroissant">
          Trier par prix décroissant
        </button>
        <br />
        <button class="btn-filtrer-disponibilte">
          Filtrer avec disponibilté
        </button>
        <br />
        <button class="btn-non-abordables">
          Filtrer les pièces non abordables
        </button>
        <br />
        <button class="btn-filtrer-description">
          Filtrer avec description
        </button>
        <br />
        <input id="inputPrixMax" type="range" min="0" max="60" step="5" />
        <h3>Ajouter un avis</h3>
        <form class="formulaire-avis">
          Identifiant de la pièce :<br />
          <input type="number" name="piece-id" /><br />
          Nom d'utilisateur :<br />
          <input type="text" name="utilisateur" /><br />
          Avis :<br />
          <input type="text" name="commentaire" /><br />
          Notes :<br />
          <input type="number" name="nb-etoiles" /><br />
          <button>Envoyer</button>
        </form>
        <h3>Donnés</h3>
        <button class="btn-maj">Mettre à jour les pièces</button>

        <h3>Aperçu des avis</h3>
        <canvas id="graphique-avis" width="300" height="300"></canvas>

        <h3>Statistiques commentaires</h3>
        <canvas id="graphique-dispo" width="300" height="300"></canvas>
        <br />

        <button class="btn-dark-mode">Mode sombre</button>
        <br />

      </section>

      <!-- Fiches produits -->
      <section class="fiches">
        <div class="abordables">Pièces abordables :</div>
        <div class="disponibles">Pièces disponibles :</div>
      </section>
    </main>
  </body>
</html>
